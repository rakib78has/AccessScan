name: Release

# Runs when a version tag such as v0.2.0 is pushed. It publishes a GitHub
# release with the store-ready zip and its checksum. Submitting to the Chrome
# Web Store stays a deliberate, manual step (docs/release-process.md).
on:
  push:
    tags: ['v*.*.*']

# Read-only by default; only the publish job may write, and only releases.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Fail fast, before the long test run, if the tag, package.json and changelog disagree.
      - name: Check tag, version and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG"

  verify:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG" --notes release-notes.md
      - run: npm run build
      # package.mjs validates the build itself and refuses an invalid one.
      - run: npm run package
      - name: Verify package checksum
        working-directory: release
        run: sha256sum --check ./*.sha256
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          release/*.zip release/*.zip.sha256
          --title "SiteCheck ${TAG#v}"
          --notes-file release-notes.md
          --verify-tag
